name: skilldisha
description: "SkillDisha Education App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  lottie: ^3.5.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.6.1
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo.jpg"

flutter:
  uses-material-design: true

  assets:
    - assets/icon/logo.jpg
    - assets/animations/success.json